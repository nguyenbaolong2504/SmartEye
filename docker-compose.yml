services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarteye
      POSTGRES_USER: smarteye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarteye"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smarteye:${POSTGRES_PASSWORD}@database:5432/smarteye
      YOLO_MODEL_PATH: /app/backend/data/models/yolo11n.pt
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
